name: DevOps Pipeline - Playwright & Security

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  devops-pipeline:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar o código do repositório
      uses: actions/checkout@v4

    - name: 2. Configurar o ambiente Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: 3. Instalar as dependências do projeto
      run: npm ci

    - name: 🛡️ 4. Teste de Segurança (Verificar Vulnerabilidades)
      run: npm audit --audit-level=high

    - name: 5. Instalar navegadores do Playwright
      run: npx playwright install chromium --with-deps

    - name: 🚀 6. Executar os Testes Automatizados
      run: npx playwright test --project=chromium
